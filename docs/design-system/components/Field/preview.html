<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title>
<style>body{padding:16px} </style></head>
<body>
<div id="root"></div>
<script>
var V = window.VCP, h = React.createElement, S = V.sample;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'vcp-stack', style:{maxWidth:'520px'}},
  h(V.Field, {label:'Title'}, h(V.Input, {defaultValue:'The Eiffel Tower grows about 15 cm in summer'})),
  h(V.Field, {label:'Why surprising', error:'Say why a viewer would not expect this.'}, h(V.Textarea, {rows:2})),
  h(V.Field, {label:'Domain'}, h(V.Select, {options:['engineering','history','nature','science','space','culture']})),
  h(V.Field, {label:'Evidence', optional:true, hint:'One URL or quote per line.'}, h(V.Textarea, {rows:2, placeholder:'https://…'})),
  h(V.Checkbox, {label:'This is an opinion', hint:'Opinions are flagged and need a stronger source.'})));
</script>
</body>
</html>
