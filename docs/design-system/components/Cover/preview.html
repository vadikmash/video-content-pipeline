<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; height: 288px; background: var(--bg); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; }
  svg { position: absolute; inset: 0; }
  .signal { fill: var(--signal); }
  .running { fill: var(--running); }
  .done { fill: var(--done); }
  .ink { fill: var(--ink); }
  .pending { fill: none; stroke: var(--line-strong); stroke-width: 1; }
  .r-lg { rx: var(--radius-lg); }
  .r-md { rx: var(--radius-md); }
  .r-sm { rx: var(--radius-sm); }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 600; font-size: 120px; line-height: .92; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: signal 9:16 slab 128×228 (radius-lg) · running band 268×72 (radius-md) · done 72×140 (radius-md) · ink 204×140 bleeding right (radius-md)
      arrangement: one tall slab (the vertical video frame) with satellites in a flush modular grid, space-4 (16px) gutters, ink block off the right edge
      pattern: geometric/modular dense UI → the stage strip itself: 11 tiles, gates taller, done/waiting/pending, because the pipeline is what this system is about
      steps & radii: space-4 gutters, space-6 top inset, tiles 32 wide at 6px pitch gap; radius-lg, radius-md, radius-sm
    -->
    <g>
      <rect class="done r-sm" x="524" y="28" width="32" height="10"/>
      <rect class="done r-sm" x="562" y="28" width="32" height="10"/>
      <rect class="done r-sm" x="600" y="24" width="32" height="18"/>
      <rect class="done r-sm" x="638" y="28" width="32" height="10"/>
      <rect class="done r-sm" x="676" y="28" width="32" height="10"/>
      <rect class="done r-sm" x="714" y="28" width="32" height="10"/>
      <rect class="done r-sm" x="752" y="28" width="32" height="10"/>
      <rect class="signal r-sm" x="790" y="24" width="32" height="18"/>
      <rect class="pending r-sm" x="828.5" y="28.5" width="31" height="9"/>
      <rect class="pending r-sm" x="866.5" y="24.5" width="31" height="17"/>
      <rect class="pending r-sm" x="904.5" y="28.5" width="31" height="9"/>
    </g>
    <rect class="signal r-lg" x="524" y="58" width="128" height="228"/>
    <rect class="running r-md" x="668" y="58" width="268" height="72"/>
    <rect class="done r-md" x="668" y="146" width="72" height="140"/>
    <rect class="ink r-md" x="756" y="146" width="220" height="140"/>
  </svg>
  <div class="text">
    <h1 class="name">VCP</h1>
    <p class="tag">An operator workbench for turning surprising facts into vertical video.</p>
  </div>
</div>
</body>
</html>
