<!doctype html>
<html>
<head><meta charset="utf-8"><title>IdeaRow</title>
<style>body{padding:16px} </style></head>
<body>
<div id="root"></div>
<script>
var V = window.VCP, h = React.createElement, S = V.sample;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'vcp-list'},
  h(V.IdeaRow, {idea:S.ideas[1], defaultOpen:true}),
  h(V.IdeaRow, {idea:S.ideas[2]}),
  h(V.IdeaRow, {idea:S.ideas[0], projectHref:'#'}),
  h(V.IdeaRow, {idea:S.ideas[6]})));
</script>
</body>
</html>
