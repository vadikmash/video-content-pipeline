name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: apps/pipeline/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm browser:ensure

      - run: pnpm test:e2e

